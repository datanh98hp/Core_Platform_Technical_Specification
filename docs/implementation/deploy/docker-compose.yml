name: startup-platform-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/00-bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ../sql/01-identity.sql:/docker-entrypoint-initdb.d/01-identity.sql:ro
      - ../sql/02-core.sql:/docker-entrypoint-initdb.d/02-core.sql:ro
      - ../sql/03-document.sql:/docker-entrypoint-initdb.d/03-document.sql:ro
      - ../sql/04-knowledge.sql:/docker-entrypoint-initdb.d/04-knowledge.sql:ro
      - ../sql/05-ai.sql:/docker-entrypoint-initdb.d/05-ai.sql:ro
      - ../sql/06-workflow.sql:/docker-entrypoint-initdb.d/06-workflow.sql:ro
      - ../sql/07-integration.sql:/docker-entrypoint-initdb.d/07-integration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_USER: ${NATS_USER:-platform}
      NATS_PASSWORD: ${NATS_PASSWORD:?Set NATS_PASSWORD}
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
      - ./nats-server.conf:/etc/nats/nats.conf:ro

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: [miniodata:/data]

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
