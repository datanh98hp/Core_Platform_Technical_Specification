openapi: 3.1.0
info:
  title: Startup Core Platform API
  version: 1.0.0
  description: Public REST API. Internal service-to-service calls use gRPC.
servers:
  - url: https://api.example.invalid/api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 10}
      responses:
        "200": {description: Auth tokens, content: {application/json: {schema: {$ref: "#/components/schemas/AuthTokens"}}}}
        "401": {description: Invalid credentials}
  /auth/refresh:
    post:
      security: []
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [refreshToken], properties: {refreshToken: {type: string}}}
      responses:
        "200": {description: Rotated tokens, content: {application/json: {schema: {$ref: "#/components/schemas/AuthTokens"}}}}
  /auth/logout:
    post:
      summary: Revoke session
      responses:
        "204": {description: Revoked}
  /me:
    get:
      summary: Current user
      responses:
        "200": {description: Current user, content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}}
  /organizations:
    get:
      summary: List organizations current user belongs to
      responses:
        "200": {description: Organization list}
  /organizations/{orgId}/members:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    get:
      summary: List members
      parameters:
        - {in: query, name: cursor, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200": {description: Member page}
    post:
      summary: Invite member
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [email], properties: {email: {type: string, format: email}, roleKeys: {type: array, items: {type: string}}}}
      responses:
        "202": {description: Invitation accepted}
  /organizations/{orgId}/workspaces:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    get:
      summary: List workspaces
      responses:
        "200": {description: Workspace list}
    post:
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string, minLength: 2, maxLength: 120}}}
      responses:
        "201": {description: Workspace created}
  /organizations/{orgId}/documents/upload-sessions:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    post:
      summary: Create signed upload session
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, mimeType, sizeBytes, checksumSha256]
              properties:
                workspaceId: {type: string, format: uuid}
                filename: {type: string, maxLength: 255}
                mimeType: {type: string}
                sizeBytes: {type: integer, minimum: 1}
                checksumSha256: {type: string, minLength: 64, maxLength: 64}
      responses:
        "201": {description: Upload session created, content: {application/json: {schema: {$ref: "#/components/schemas/UploadSession"}}}}
  /organizations/{orgId}/documents:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    get:
      summary: List documents
      responses:
        "200": {description: Document page}
  /organizations/{orgId}/documents/{documentId}:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {$ref: "#/components/parameters/DocumentId"}
    get:
      summary: Get document metadata
      responses:
        "200": {description: Document metadata}
    delete:
      summary: Soft delete document
      responses:
        "202": {description: Deletion accepted}
  /organizations/{orgId}/documents/{documentId}/complete-upload:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {$ref: "#/components/parameters/DocumentId"}
    post:
      summary: Verify object and finalize upload
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "202": {description: Upload verified}
  /organizations/{orgId}/documents/{documentId}/processing-jobs:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {$ref: "#/components/parameters/DocumentId"}
    post:
      summary: Queue document processing
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [pipelineKey], properties: {pipelineKey: {type: string}}}
      responses:
        "202": {description: Processing job queued}
  /organizations/{orgId}/knowledge-bases:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    post:
      summary: Create knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string}, workspaceId: {type: string, format: uuid}, visibility: {type: string, enum: [private, workspace, organization]}}}
      responses:
        "201": {description: Created}
  /organizations/{orgId}/knowledge-bases/{kbId}/search:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {in: path, name: kbId, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Permission-aware knowledge search
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [query], properties: {query: {type: string, minLength: 1, maxLength: 8000}, topK: {type: integer, minimum: 1, maximum: 30, default: 8}}}
      responses:
        "200": {description: Search hits with source references}
  /organizations/{orgId}/ai/generations:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    post:
      summary: Create AI generation job
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [purpose, input], properties: {purpose: {type: string}, input: {type: string, maxLength: 50000}, modelPolicy: {type: string, default: balanced}, promptVersion: {type: string}}}
      responses:
        "202": {description: Accepted}
  /organizations/{orgId}/workflow-runs:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    post:
      summary: Start workflow run
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [workflowKey], properties: {workflowKey: {type: string}, businessRef: {type: string}, input: {type: object, additionalProperties: true}}}
      responses:
        "202": {description: Workflow accepted}
  /organizations/{orgId}/tasks:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    get:
      summary: Current user's task inbox
      responses:
        "200": {description: Task page}
  /organizations/{orgId}/tasks/{taskId}/complete:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
      - {in: path, name: taskId, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Complete or decide task
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [approve, reject, complete]}, comment: {type: string, maxLength: 4000}}}
      responses:
        "200": {description: Transition committed}
  /organizations/{orgId}/webhooks:
    parameters:
      - {$ref: "#/components/parameters/OrgId"}
    post:
      summary: Register webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [targetUrl, eventTypes], properties: {targetUrl: {type: string, format: uri}, eventTypes: {type: array, items: {type: string}}}}
      responses:
        "201": {description: Webhook registered}
  /health/live:
    get:
      security: []
      summary: Liveness
      responses:
        "200": {description: Process alive}
  /health/ready:
    get:
      security: []
      summary: Readiness
      responses:
        "200": {description: Ready}
        "503": {description: Not ready}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    OrgId: {in: path, name: orgId, required: true, schema: {type: string, format: uuid}}
    DocumentId: {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  schemas:
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresIn: {type: integer}
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
    UploadSession:
      type: object
      required: [documentId, uploadUrl, expiresAt]
      properties:
        documentId: {type: string, format: uuid}
        uploadUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
        requiredHeaders: {type: object, additionalProperties: {type: string}}
